# Generates the neon "snake eating your contributions" animation daily
# and pushes it to an `output` branch that the README reads from.
name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=#05d9e8&color_dots=#1a1025,#4a1035,#8a1a4f,#c8235e,#ff2a6d&color_dot_border=#0a0612&color_background=#0a0612
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
