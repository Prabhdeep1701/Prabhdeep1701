.row{animation:in .5s ease-out both}@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.k{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:13px;fill:#ff2a6d;letter-spacing:2px}
.v{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:16px;fill:#fff}
