<svg xmlns="http://www.w3.org/2000/svg" width="580" height="320" viewBox="0 0 580 320">
<defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2a6d"/><stop offset="1" stop-color="#b967ff"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/><stop offset=".5" stop-color="#ff2a6d" stop-opacity=".1"/><stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/></linearGradient>
<clipPath id="cc"><rect x="2" y="2" width="576" height="316" rx="14"/></clipPath></defs>
<style>
.gc{animation:gc 4s steps(1) infinite}
.gp{animation:gp 4s steps(1) infinite}
.fl{animation:fl 4s linear infinite}
@keyframes gc{0%,100%{transform:translate(-2px,0)}86%{transform:translate(-5px,-2px)}88%{transform:translate(4px,2px)}90%{transform:translate(-5px,0)}92%{transform:translate(-2px,0)}}
@keyframes gp{0%,100%{transform:translate(2px,0)}86%{transform:translate(5px,2px)}88%{transform:translate(-4px,-2px)}90%{transform:translate(4px,0)}92%{transform:translate(2px,0)}}
@keyframes fl{0%,85%,100%{opacity:1}87%{opacity:.5}88%{opacity:1}90%{opacity:.25}91%{opacity:1}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.run{animation:run 5s linear infinite}@keyframes run{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.ring{animation:ring 2.4s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.sweep{animation:rot 2.5s linear infinite}.spin{animation:rot 10s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}
.hp{animation:hp 2.1s ease-in-out infinite}@keyframes hp{0%,100%{opacity:.4}50%{opacity:1}}
.ty{animation:ty 2s steps(6) infinite}@keyframes ty{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.draw{stroke-dasharray:100;animation:draw 2.6s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:100}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
.sw{animation:sw 4s linear infinite}@keyframes sw{from{transform:translateX(-200px)}to{transform:translateX(630px)}}
</style>
<rect x="2" y="2" width="576" height="316" rx="14" fill="#0a0612" stroke="#2a1840" stroke-width="2"/>
<g clip-path="url(#cc)"><rect width="160" height="320" fill="url(#scan)" class="sw"/></g>
<rect x="2" y="2" width="576" height="316" rx="14" fill="none" stroke="url(#bd)" stroke-width="2.5" pathLength="1000" stroke-dasharray="110 890" class="run" filter="url(#glow)"/>
