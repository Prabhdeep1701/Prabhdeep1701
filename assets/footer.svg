.tp{animation:tp 7s steps(19) infinite}@keyframes tp{0%{transform:translateX(0)}25%,90%{transform:translateX(1000px)}100%{transform:translateX(0)}}
.hl{animation:hl 3s cubic-bezier(.6,0,1,.4) infinite both}@keyframes hl{0%{transform:translateY(0);opacity:0}20%{opacity:.7}100%{transform:translateY(80px);opacity:.8}}
