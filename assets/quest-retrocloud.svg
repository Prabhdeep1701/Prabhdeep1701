<text x="556" y="34" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#b967ff" text-anchor="end" letter-spacing="1.5">CLEARED</text>
<line x1="500" y1="54" x2="464" y2="108" stroke="#05d9e8" stroke-width="2" stroke-dasharray="4 6" class="flow"/><line x1="464" y1="108" x2="536" y2="108" stroke="#05d9e8" stroke-width="2" stroke-dasharray="4 6" class="flow"/><line x1="536" y1="108" x2="500" y2="54" stroke="#05d9e8" stroke-width="2" stroke-dasharray="4 6" class="flow"/><rect x="491" y="45" width="18" height="18" rx="3" fill="#b967ff" fill-opacity=".2" stroke="#b967ff" stroke-width="2.5" class="hp" style="animation-delay:-0.0s" filter="url(#glow)"/><rect x="455" y="99" width="18" height="18" rx="3" fill="#b967ff" fill-opacity=".2" stroke="#b967ff" stroke-width="2.5" class="hp" style="animation-delay:-0.7s" filter="url(#glow)"/><rect x="527" y="99" width="18" height="18" rx="3" fill="#b967ff" fill-opacity=".2" stroke="#b967ff" stroke-width="2.5" class="hp" style="animation-delay:-1.4s" filter="url(#glow)"/>
<g letter-spacing="1"><text x="24" y="84" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="900" text-anchor="start"  fill="#05d9e8" class="gc" opacity=".9">RetroCloud</text><text x="24" y="84" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="900" text-anchor="start"  fill="#b967ff" class="gp" opacity=".9">RetroCloud</text><text x="24" y="84" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="900" text-anchor="start"  fill="#ffffff" class="fl" filter="url(#glow)">RetroCloud</text></g>
<text x="24" y="110" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#b967ff">distributed storage // old laptops -&gt; cloud</text>
<text x="24" y="150" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#c9c3d9"><tspan fill="#b967ff">▸ </tspan>legacy hardware reborn as storage nodes</text><text x="24" y="177" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#c9c3d9"><tspan fill="#b967ff">▸ </tspan>E2E encryption + plausible deniability</text><text x="24" y="204" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#c9c3d9"><tspan fill="#b967ff">▸ </tspan>reachable anywhere via encrypted tunnels</text>
