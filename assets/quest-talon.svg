<svg xmlns="http://www.w3.org/2000/svg" width="580" height="320" viewBox="0 0 580 320">
<defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9f002"/><stop offset="1" stop-color="#ff2a6d"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f9f002" stop-opacity="0"/><stop offset=".5" stop-color="#f9f002" stop-opacity=".1"/><stop offset="1" stop-color="#f9f002" stop-opacity="0"/></linearGradient>
